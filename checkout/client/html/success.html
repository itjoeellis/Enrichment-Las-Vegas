<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Enrichment Payment Success</title>

<link href="/img/favicon.png" rel="icon" type="image/png" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="./success.js" defer></script>
  </head>

  <body>
    <div class="sr-root">
      <div class="sr-main">
        <header class="sr-header">
          <div class="sr-header__logo"></div>
        </header>

        <div class="sr-payment-summary completed-view">
          <h1>Thank you for your payment.</h1>
          <h4>
            Your payment has been sucessfully processed, and someone from the Enrichment Administration Department will be reaching out shortly.
          </h4>
        </div>
        <div class="sr-section completed-view">
          <div class="sr-callout">
            <pre></pre>
          </div>
          <button onclick="window.location.href = '/';">Back to Enrichment</button>
        </div>
      </div>

      <div class="sr-content">
        <div class="pasha-image-stack">
          <img src="enrich.png" alt=""
            width="300"
            height="160"
          />

        </div>
      </div>
    </div>
  </body>
</html>
